server {
    listen 80;
    listen [::]:80;
    server_name simple-vpn.download;

    root /var/www/simple-vpn;
    index index.html;

    server_tokens off;
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /releases.json {
        proxy_pass https://simple-vpn-infra-backups.ams3.digitaloceanspaces.com/apk/releases.json;
        proxy_set_header Host simple-vpn-infra-backups.ams3.digitaloceanspaces.com;
        proxy_ssl_server_name on;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = /download/latest.apk {
        proxy_pass https://simple-vpn-infra-backups.ams3.digitaloceanspaces.com/apk/latest/simple-vpn.apk;
        proxy_set_header Host simple-vpn-infra-backups.ams3.digitaloceanspaces.com;
        proxy_ssl_server_name on;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_buffering off;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /download/releases/ {
        rewrite ^/download/(.*)$ /apk/$1 break;
        proxy_pass https://simple-vpn-infra-backups.ams3.digitaloceanspaces.com;
        proxy_set_header Host simple-vpn-infra-backups.ams3.digitaloceanspaces.com;
        proxy_ssl_server_name on;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
