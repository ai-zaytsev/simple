name: Email Provider Check

# Brevo deliverability probe.
#
# The repository is public, so Actions logs are public too.
# This workflow never prints the API key, recipient addresses or account data.
# Recipients are referred to by class only: gmail and yandex.
#
# Messages are sent as plain text on purpose: that removes the open-tracking
# pixel and leaves links unrewritten. See docs/integrations/brevo.md.

on:
  workflow_dispatch:

jobs:
  email-check:
    name: Email Provider Check
    runs-on: ubuntu-latest

    steps:
      - name: Check configuration
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TEST_GMAIL: ${{ secrets.EMAIL_TEST_GMAIL }}
          EMAIL_TEST_YANDEX: ${{ secrets.EMAIL_TEST_YANDEX }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${BREVO_API_KEY}" ] || missing="${missing} secrets.BREVO_API_KEY"
          [ -n "${EMAIL_TEST_GMAIL}" ] || missing="${missing} secrets.EMAIL_TEST_GMAIL"
          [ -n "${EMAIL_TEST_YANDEX}" ] || missing="${missing} secrets.EMAIL_TEST_YANDEX"
          [ -n "${BREVO_SENDER_EMAIL}" ] || missing="${missing} vars.BREVO_SENDER_EMAIL"

          if [ -n "${missing}" ]; then
            echo "Not configured:${missing}"
            echo "See docs/integrations/brevo.md"
            exit 1
          fi
          echo "Configuration is complete."

      - name: Verify API key
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/account.json -w '%{http_code}' \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "accept: application/json" \
            https://api.brevo.com/v3/account)

          if [ "${code}" != "200" ]; then
            echo "Key verification failed. HTTP ${code}."
            case "${code}" in
              401) echo "Key is invalid or revoked." ;;
              403) echo "Key lacks permissions." ;;
              429) echo "Provider rate limit reached." ;;
            esac
            exit 1
          fi

          # Plan type and credit balance are account data and must not reach
          # public logs, so only a boolean signal is emitted.
          credits=$(jq -r '[(.plan // [])[] | (.credits // 0)] | add // 0 | if . > 0 then "available" else "exhausted" end' /tmp/account.json)

          echo "Key is valid."
          {
            echo "## Email Provider Check"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Brevo key | valid |"
            echo "| Sending credits | ${credits} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${credits}" = "exhausted" ]; then
            echo "Sending credits are exhausted, messages would not go out."
            exit 1
          fi

      - name: Send probe messages
        id: send
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          EMAIL_TEST_GMAIL: ${{ secrets.EMAIL_TEST_GMAIL }}
          EMAIL_TEST_YANDEX: ${{ secrets.EMAIL_TEST_YANDEX }}
        run: |
          set -euo pipefail
          stamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          failed=0

          send_one() {
            label="$1"
            recipient="$2"
            probe_link="https://simple-vpn.download/auth/verify?token=probe-${label}-$(date -u +%s)"

            jq -n \
              --arg sender "${BREVO_SENDER_EMAIL}" \
              --arg to "${recipient}" \
              --arg stamp "${stamp}" \
              --arg label "${label}" \
              --arg link "${probe_link}" \
              '{
                sender: { email: $sender, name: "Simple VPN" },
                to: [ { email: $to } ],
                subject: "Deliverability probe \($stamp)",
                textContent: (
                  "Deliverability probe message.\n\n" +
                  "Sample link, shaped like a magic link:\n\($link)\n\n" +
                  "Check two things:\n" +
                  "1. This message is in Inbox, not in Spam.\n" +
                  "2. The link above is NOT rewritten to a provider tracking domain.\n\n" +
                  "Recipient class: \($label)\nSent at: \($stamp)\n"
                ),
                tags: [ "deliverability-check", $label ]
              }' > "/tmp/payload-${label}.json"

            code=$(curl -sS -o "/tmp/send-${label}.json" -w '%{http_code}' \
              -X POST \
              -H "api-key: ${BREVO_API_KEY}" \
              -H "content-type: application/json" \
              -H "accept: application/json" \
              --data "@/tmp/payload-${label}.json" \
              https://api.brevo.com/v3/smtp/email) || code="000"

            if [ "${code}" != "201" ] && [ "${code}" != "200" ]; then
              err_code=$(jq -r '.code // "unknown"' "/tmp/send-${label}.json" 2>/dev/null || echo "unknown")
              echo "${label}: send failed, HTTP ${code}, provider code ${err_code}"
              : > "/tmp/id-${label}.txt"
              failed=1
              return 0
            fi

            message_id=$(jq -r '.messageId // empty' "/tmp/send-${label}.json")
            printf '%s' "${message_id}" > "/tmp/id-${label}.txt"
            echo "${label}: accepted by provider, HTTP ${code}"
          }

          send_one gmail "${EMAIL_TEST_GMAIL}"
          send_one yandex "${EMAIL_TEST_YANDEX}"

          gmail_id=$(cat /tmp/id-gmail.txt)
          yandex_id=$(cat /tmp/id-yandex.txt)

          gmail_state=failed
          [ -n "${gmail_id}" ] && gmail_state=accepted
          yandex_state=failed
          [ -n "${yandex_id}" ] && yandex_state=accepted

          {
            echo ""
            echo "| Recipient | Send status | messageId |"
            echo "| --- | --- | --- |"
            echo "| gmail | ${gmail_state} | \`${gmail_id:-none}\` |"
            echo "| yandex | ${yandex_state} | \`${yandex_id:-none}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          {
            echo "gmail_message_id=${gmail_id}"
            echo "yandex_message_id=${yandex_id}"
            echo "send_failed=${failed}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${failed}" -ne 0 ]; then
            echo "At least one send failed. Events are still polled, verdict comes last."
          fi

      - name: Poll delivery events
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GMAIL_ID: ${{ steps.send.outputs.gmail_message_id }}
          YANDEX_ID: ${{ steps.send.outputs.yandex_message_id }}
        run: |
          set -euo pipefail

          poll_one() {
            label="$1"
            message_id="$2"

            if [ -z "${message_id}" ]; then
              echo "${label}: no messageId, polling skipped"
              printf '%s' "no messageId" > "/tmp/ev-${label}.txt"
              return 0
            fi

            events=""
            for _ in 1 2 3 4 5 6; do
              code=$(curl -sS -o "/tmp/events-${label}.json" -w '%{http_code}' \
                -G \
                -H "api-key: ${BREVO_API_KEY}" \
                -H "accept: application/json" \
                --data-urlencode "messageId=${message_id}" \
                --data-urlencode "limit=20" \
                https://api.brevo.com/v3/smtp/statistics/events) || code="000"

              if [ "${code}" = "200" ]; then
                events=$(jq -r '(.events // []) | map(.event) | unique | join(", ")' "/tmp/events-${label}.json")
                [ -n "${events}" ] && break
              fi
              sleep 10
            done

            if [ -n "${events}" ]; then
              echo "${label}: ${events}"
              printf '%s' "${events}" > "/tmp/ev-${label}.txt"
            else
              echo "${label}: no events yet, the provider reports them with a delay"
              printf '%s' "none yet" > "/tmp/ev-${label}.txt"
            fi
          }

          poll_one gmail "${GMAIL_ID}"
          poll_one yandex "${YANDEX_ID}"

          {
            echo ""
            echo "| Recipient | Delivery events |"
            echo "| --- | --- |"
            echo "| gmail | \`$(cat /tmp/ev-gmail.txt)\` |"
            echo "| yandex | \`$(cat /tmp/ev-yandex.txt)\` |"
            echo ""
            echo "Inbox vs Spam cannot be determined automatically."
            echo "Check both mailboxes by hand and confirm the link was not rewritten."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verdict
        if: always()
        env:
          SEND_FAILED: ${{ steps.send.outputs.send_failed }}
        run: |
          set -euo pipefail
          if [ "${SEND_FAILED:-1}" != "0" ]; then
            echo "Check failed: at least one message was not accepted by the provider."
            exit 1
          fi
          echo "Both messages accepted by the provider. Final deliverability verdict is human."
