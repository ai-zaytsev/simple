name: Node Inspect

# What one node is actually doing, read and not touched.
#
# The speed limit is the first thing whose failure looks exactly like success:
# the tunnel works, the page loads, and the only sign that the limit is absent
# is a number on somebody's phone. Everything needed to tell why lives on the
# node - the routing table the engine loaded, the list it was handed, the
# queues the kernel holds - and until now the only way to see any of it was to
# run the installer, which changes all three.
#
# So this changes nothing. No install, no restart, no configuration written.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: Which node, as the panel shows it.
        required: true
        type: string

permissions:
  contents: read

env:
  JUMP: ${{ secrets.CP_DEPLOY_HOST }}

jobs:
  inspect:
    name: Node Inspect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reach the Control Plane
        env:
          DEPLOY_KEY: ${{ secrets.CP_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          {
            echo "Host *"
            echo "  IdentityFile ~/.ssh/deploy"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -H "${JUMP}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "root@${JUMP}" true

      - name: Find the node
        id: node
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          address=$(ssh "root@${JUMP}" \
            "psql \"\$(cat /etc/simple-vpn-cp.dsn)\" -tAc \
             \"select host from nodes where alias = '${ALIAS}' and state <> 'removed'\"" \
            | tr -d '[:space:]')
          if [ -z "${address}" ] || [ "${address}" = "0.0.0.0" ]; then
            echo "No node called '${ALIAS}' has an address."
            exit 1
          fi
          echo "::add-mask::${address}"
          echo "address=${address}" >> "${GITHUB_OUTPUT}"

      - name: Say what it is doing
        env:
          ADDRESS: ${{ steps.node.outputs.address }}
        run: |
          set -euo pipefail

          # Written to a file and named, because ssh-retry.sh reads its input
          # from SSH_STDIN and redirects everything else from nowhere. A
          # heredoc piped at it is discarded in silence: the first version of
          # this ran, succeeded, and printed nothing at all.
          #
          # That contract exists for a reason - an implicit stdin left an
          # earlier run hanging on an unclosed pipe - so the fix is to honour
          # it rather than to work around it.
          cat > /tmp/inspect.sh <<'REMOTE'
          set -u

          echo "=== Who is held to a speed ==="
          if [ -s /etc/simple-vpn-limited.json ]; then
            echo "  the node has been handed $(python3 -c 'import json;print(len(json.load(open("/etc/simple-vpn-limited.json"))))' 2>/dev/null || echo '?') credential(s) to slow"
          else
            echo "  no list has been applied; nobody is being slowed"
          fi

          echo "=== Does the engine route them apart ==="
          slow=$(grep -c '"slow-' /usr/local/etc/xray/config.json 2>/dev/null || echo 0)
          echo "  outbounds and rules mentioning the shaped set: ${slow}"

          echo "=== Is the mark on the socket ==="
          grep -o '"mark": *[0-9]*' /usr/local/etc/xray/config.json 2>/dev/null | sort -u | sed 's/^/  /' \
            || echo "  no mark in the engine's configuration"

          echo "=== What the kernel is shaping ==="
          iface=$(ip route show default | awk '/default/ {print $5; exit}')
          # With counters. Which class a packet was put in is a fact about the
          # configuration; how many bytes went through it is a fact about what
          # happened, and only the second one answers "is the limit working".
          #
          # Everything above this line was already right - the rules match, the
          # mark is set, the filter points at the class - and the speed was
          # still unlimited. So the question left is whether the packets that
          # reach that class are actually being held by it.
          tc -s class show dev "${iface}" 2>/dev/null | grep -A 2 "htb 1:" | sed "s/^/  /" || echo "  nothing on the way out"
          echo "  --- the way in ---"
          tc -s class show dev ifb-slow 2>/dev/null | grep -A 2 "htb 1:" | sed "s/^/  /" || echo "  nothing on the way in"

          echo "=== Is anything pointed at that class ==="
          # A class with no filter catches nothing, and looks exactly like a
          # class that does. The first inspection printed the classes and not
          # the filters, which is why it read as a chain that was whole.
          # Captured, then judged. Piping into sed and relying on `||` reports
          # sed's success, not the command's, so an empty answer printed
          # nothing at all - and an absent filter is the answer that matters
          # most here.
          out=$(tc filter show dev "${iface}" 2>/dev/null || true)
          [ -n "${out}" ] && printf '%s\n' "${out}" | sed "s/^/  /" \
            || echo "  no filter on the way out"
          in=$(tc filter show dev ifb-slow 2>/dev/null || true)
          [ -n "${in}" ] && printf '%s\n' "${in}" | sed "s/^/  /" \
            || echo "  no filter on the way in"
          echo "  --- and is the way in redirected at all ---"
          # On the ingress hook specifically. The plain listing shows the root
          # and says nothing about whether incoming packets are being moved to
          # the device that shapes them - which is the whole of the download
          # direction, and the one people notice.
          redirect=$(tc filter show dev "${iface}" parent ffff: 2>/dev/null || true)
          if [ -n "${redirect}" ]; then
            printf '%s\n' "${redirect}" | sed "s/^/  /"
          else
            echo "  nothing is redirecting the way in"
          fi
          tc qdisc show dev "${iface}" 2>/dev/null | sed "s/^/  /"

          echo "=== Where the bytes are actually going ==="
          # The question the speed test asks, put to the engine. If a limited
          # account's traffic is counted under the plain outbounds rather than
          # the shaped ones, the rules are not matching it, and nothing below
          # the rules can help.
          # One line, and that is not a style preference. Written across
          # several, the script's own lines began at column zero and fell out
          # of the YAML block that was supposed to contain them - after which
          # GitHub could not read the file at all and reported that this
          # workflow has no trigger. A program inside a program inside a file
          # has to respect the indentation of all three.
          /usr/local/bin/xray api statsquery --server=127.0.0.1:10085 2>/dev/null \
            | python3 -c 'import json,sys; s=json.load(sys.stdin).get("stat",[]); o=[(x.get("name","").split(">>>")[1], int(x.get("value",0) or 0)) for x in s if x.get("name","").startswith("outbound>>>")]; print("  shaped %.1f MB" % (sum(v for t,v in o if t.startswith("slow-"))/1e6)); print("  plain  %.1f MB" % (sum(v for t,v in o if not t.startswith("slow-"))/1e6))' \
            || echo "  counters could not be read"

          echo "=== Does the mark survive the return ==="
          iptables -t mangle -S 2>/dev/null | grep -i connmark | sed 's/^/  /' \
            || echo "  the connection's mark is not being saved or restored"

          echo "=== What the measuring agent last said ==="
          journalctl -u simple-vpn-metrics -n 12 --no-pager -o cat 2>/dev/null
          REMOTE

          SSH_STDIN=/tmp/inspect.sh bash infra/ssh-retry.sh \
            -J "root@${JUMP}" -o StrictHostKeyChecking=accept-new \
            "root@${ADDRESS}" 'bash -s' | sed 's/^/  /'
