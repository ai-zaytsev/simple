name: Baseline Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  process-baseline:
    name: Process Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required process artifacts
        shell: pwsh
        run: |
          $required = @(
            'AGENTS.md',
            'CLAUDE.md',
            '.specify/README.md',
            '.specify/templates/spec.md',
            '.specify/templates/plan.md',
            '.specify/templates/tasks.md',
            'docs/ai-pr-workflow.md',
            'docs/worker-orchestration.md',
            'docs/stack.md',
            'scripts/Process.Common.ps1',
            'scripts/New-FeatureBranch.ps1',
            'scripts/Select-ImplementationAgent.ps1',
            'scripts/Start-ImplementationWorker.ps1',
            'scripts/Publish-FeaturePR.ps1',
            'scripts/Invoke-AIReview.ps1'
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required process artifact: $path"
            }
          }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $errors += $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "PowerShell parsing failed."
          }

      - name: Cloud-init templates must be ASCII
        shell: pwsh
        run: |
          $templates = Get-ChildItem -Path infra -Filter *.tftpl -File -Recurse -ErrorAction SilentlyContinue
          if (-not $templates) {
            Write-Host "No cloud-init templates found, nothing to check."
            exit 0
          }

          # Non-ASCII text in user-data once reached the node double-encoded.
          # cloud-init rejected the whole document and the node booted with
          # nothing configured while reporting success: no file existed, no
          # error surfaced, and the machine looked healthy. Text that needs
          # non-ASCII lives in sites/ and travels as base64.
          $bad = @()
          foreach ($t in $templates) {
            $bytes = [System.IO.File]::ReadAllBytes($t.FullName)
            $line = 1
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10) { $line++ }
              elseif ($bytes[$i] -gt 127) {
                $bad += "$($t.Name) line $line"
                break
              }
            }
          }

          if ($bad.Count -gt 0) {
            Write-Host "Non-ASCII found in cloud-init templates:"
            $bad | ForEach-Object { Write-Host "  $_" }
            throw "Cloud-init templates must be ASCII. Move the text into sites/ and pass it as base64."
          }

          Write-Host "All $($templates.Count) cloud-init template(s) are ASCII."

      - name: Detect source layers
        id: detect
        shell: pwsh
        run: |
          $goModules = @(Get-ChildItem -Path . -Filter go.mod -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\/](\.git|vendor)[\/]' })
          $terraformFiles = @(Get-ChildItem -Path . -Filter *.tf -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\/](\.git|\.terraform)[\/]' })

          $hasGo = $goModules.Count -gt 0
          $hasTerraform = $terraformFiles.Count -gt 0

          "has_go=$($hasGo.ToString().ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT
          "has_terraform=$($hasTerraform.ToString().ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT

          Write-Host "Go modules found: $($goModules.Count)"
          Write-Host "Terraform files found: $($terraformFiles.Count)"

          if (-not $hasGo -and -not $hasTerraform) {
            Write-Host "No product source layers found yet. Baseline stays process-only."
          }

      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Vet Go modules
        if: steps.detect.outputs.has_go == 'true'
        shell: pwsh
        run: |
          $modules = Get-ChildItem -Path . -Filter go.mod -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\/](\.git|vendor)[\/]' }

          foreach ($module in $modules) {
            $moduleDir = $module.Directory.FullName
            Write-Host "::group::go vet $moduleDir"
            Push-Location $moduleDir
            try {
              go vet ./...
              if ($LASTEXITCODE -ne 0) {
                throw "go vet failed in $moduleDir"
              }
            }
            finally {
              Pop-Location
              Write-Host "::endgroup::"
            }
          }

      - name: Setup Terraform
        if: steps.detect.outputs.has_terraform == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: steps.detect.outputs.has_terraform == 'true'
        run: terraform fmt -check -recursive
