name: Baseline Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  process-baseline:
    name: Process Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required process artifacts
        shell: pwsh
        run: |
          $required = @(
            'AGENTS.md',
            'CLAUDE.md',
            '.specify/README.md',
            '.specify/templates/spec.md',
            '.specify/templates/plan.md',
            '.specify/templates/tasks.md',
            'docs/ai-pr-workflow.md',
            'docs/worker-orchestration.md',
            'docs/stack.md',
            'scripts/Process.Common.ps1',
            'scripts/New-FeatureBranch.ps1',
            'scripts/Select-ImplementationAgent.ps1',
            'scripts/Start-ImplementationWorker.ps1',
            'scripts/Publish-FeaturePR.ps1',
            'scripts/Invoke-AIReview.ps1'
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required process artifact: $path"
            }
          }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $errors += $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "PowerShell parsing failed."
          }

      - name: Cloud-init templates must be ASCII
        shell: pwsh
        run: |
          $templates = Get-ChildItem -Path infra -Filter *.tftpl -File -Recurse -ErrorAction SilentlyContinue
          if (-not $templates) {
            Write-Host "No cloud-init templates found, nothing to check."
            exit 0
          }

          # Non-ASCII text in user-data once reached the node double-encoded.
          # cloud-init rejected the whole document and the node booted with
          # nothing configured while reporting success: no file existed, no
          # error surfaced, and the machine looked healthy. Text that needs
          # non-ASCII lives in sites/ and travels as base64.
          $bad = @()
          foreach ($t in $templates) {
            $bytes = [System.IO.File]::ReadAllBytes($t.FullName)
            $line = 1
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10) { $line++ }
              elseif ($bytes[$i] -gt 127) {
                $bad += "$($t.Name) line $line"
                break
              }
            }
          }

          if ($bad.Count -gt 0) {
            Write-Host "Non-ASCII found in cloud-init templates:"
            $bad | ForEach-Object { Write-Host "  $_" }
            throw "Cloud-init templates must be ASCII. Move the text into sites/ and pass it as base64."
          }

          Write-Host "All $($templates.Count) cloud-init template(s) are ASCII."

      - name: Detect source layers
        id: detect
        shell: pwsh
        run: |
          $goModules = @(Get-ChildItem -Path . -Filter go.mod -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\/](\.git|vendor)[\/]' })
          $terraformFiles = @(Get-ChildItem -Path . -Filter *.tf -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\/](\.git|\.terraform)[\/]' })

          $hasGo = $goModules.Count -gt 0
          $hasTerraform = $terraformFiles.Count -gt 0

          "has_go=$($hasGo.ToString().ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT
          "has_terraform=$($hasTerraform.ToString().ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT

          Write-Host "Go modules found: $($goModules.Count)"
          Write-Host "Terraform files found: $($terraformFiles.Count)"

          if (-not $hasGo -and -not $hasTerraform) {
            Write-Host "No product source layers found yet. Baseline stays process-only."
          }

      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Vet Go modules
        if: steps.detect.outputs.has_go == 'true'
        shell: pwsh
        run: |
          $modules = Get-ChildItem -Path . -Filter go.mod -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\/](\.git|vendor)[\/]' }

          foreach ($module in $modules) {
            $moduleDir = $module.Directory.FullName
            Write-Host "::group::go vet $moduleDir"
            Push-Location $moduleDir
            try {
              # Dependencies first. A module whose checksums are generated at
              # build time has no go.sum in the repository, and vet reports the
              # missing entry as a vet failure, which reads like a code defect
              # rather than a fetch. Downloading is not enough: only tidy writes
              # the checksum entries that vet then verifies.
              go mod tidy
              go vet ./...
              if ($LASTEXITCODE -ne 0) {
                throw "go vet failed in $moduleDir"
              }

              # Tests as well as vet. Some of them are the only enforcement
              # behind promises this project makes about what it does not
              # store: a schema with no column for a destination stays that
              # way because a test reads the migrations and says so.
              go test ./...
              if ($LASTEXITCODE -ne 0) {
                throw "go test failed in $moduleDir"
              }
            }
            finally {
              Pop-Location
              Write-Host "::endgroup::"
            }
          }

      - name: Check the panel script
        if: steps.detect.outputs.has_go == 'true'
        shell: bash
        run: bash control-plane/tools/check-panel-script.sh

      - name: The panel reader survives both a full answer and an empty one
        shell: bash
        run: |
          set -euo pipefail
          # A fresh deployment answers with nulls almost everywhere, and that
          # is exactly the moment somebody needs to read the panel. Both
          # shapes are exercised so the reader cannot fail on the one that
          # matters most.
          for fixture in .github/scripts/fixtures/overview-*.json; do
            python3 .github/scripts/read_panel.py "$fixture" > /dev/null
            echo "ok: $fixture"
          done

          # Not crashing is not the same as reading correctly, and the
          # difference is what the first live run cost: a domain nothing could
          # reach was printed as one nobody had checked, because a zero was
          # being folded into the not-measured fallback. The fixture holds that
          # exact shape and the output is now looked at rather than discarded.
          zeroes=$(python3 .github/scripts/read_panel.py \
            .github/scripts/fixtures/overview-zeroes.json)

          echo "${zeroes}" | grep -q 'unreachable | 0% | 0%' || {
            echo "A measured zero is being printed as though nothing was measured."
            echo "${zeroes}" | grep -A 4 'Точки входа'
            exit 1
          }
          echo "ok: a zero reads as a zero"

          echo "${zeroes}" | grep -q 'посчитаны по 10 ч истории' || {
            echo "The peaks do not say how much history they rest on."
            exit 1
          }
          echo "ok: the peaks carry their span"

          # A ceiling has three answers and they must stay three. Absent is
          # unlimited, zero is none, and a number is a number. Folding any two
          # together is how a tier that was supposed to be freed reads as one
          # that was capped - and the panel is the only place that difference
          # is ever looked at.
          echo "${zeroes}" | grep -q '| VIP | 0 | без предела | без предела | без предела |' || {
            echo "An absent limit is not being printed as unlimited."
            echo "${zeroes}" | grep -A 5 'Что даёт тариф' || echo "(no tier section at all)"
            exit 1
          }
          echo "${zeroes}" | grep -q '| FREE | 1 | 1 | нет | 10 Мбит/с |' || {
            echo "A real limit is not being printed as itself."
            echo "${zeroes}" | grep -A 5 'Что даёт тариф' || echo "(no tier section at all)"
            exit 1
          }
          echo "ok: unlimited, none and a number read as three different things"

      - name: Every workflow must still parse
        shell: bash
        run: |
          set -euo pipefail
          # A workflow that does not parse does not announce itself. GitHub
          # keeps the last version it could read and answers a dispatch with
          # "this workflow has no trigger" - which sounds like a missing line
          # rather than a broken file, and sent me looking in the wrong place.
          #
          # It broke because a script embedded in a run block had lines at
          # column zero: inside the file they read as new top-level keys. A
          # program inside a program inside a file has to respect the
          # indentation of all three, and nothing said so until now.
          python3 - <<'PY'
          import sys, yaml, pathlib
          bad = 0
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  loaded = yaml.safe_load(path.read_text())
              except Exception as problem:
                  print(f"{path}: does not parse: {problem}")
                  bad = 1
                  continue
              if not isinstance(loaded, dict) or not loaded.get(True, loaded.get("on")):
                  print(f"{path}: parses, but has no trigger; it would never run")
                  bad = 1
          print("ok: every workflow parses and has a trigger" if not bad else "")
          sys.exit(bad)
          PY

      - name: No backslash-n where a line break was meant
        shell: bash
        # A diagnostic broke this way and reported the opposite of the
        # truth about a live node. The check is cheap; being lied to by
        # my own tool cost an evening.
        run: bash .github/scripts/check-no-stray-escapes.sh

      - name: An address published to a step output must be masked first
        shell: bash
        run: bash .github/scripts/check-masked-addresses.sh

      - name: Setup Terraform
        if: steps.detect.outputs.has_terraform == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: steps.detect.outputs.has_terraform == 'true'
        run: terraform fmt -check -recursive
