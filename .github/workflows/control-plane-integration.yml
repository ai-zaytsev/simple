name: Control Plane Integration

on:
  pull_request:
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-lifecycle:
    name: PostgreSQL Lifecycle
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: simple_vpn_test
          POSTGRES_USER: simple_vpn
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simple_vpn -d simple_vpn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: Exercise migrations and transactional store lifecycle
        working-directory: control-plane
        env:
          TEST_DATABASE_URL: postgres://simple_vpn:integration-only@127.0.0.1:5432/simple_vpn_test?sslmode=disable
        run: go test -count=1 ./internal/store
