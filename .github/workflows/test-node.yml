name: Test Node

# Creates a VLESS + REALITY node, proves it carries traffic, and destroys it.
#
# Everything happens in one run on purpose. The node's credential is generated
# here, used here and dies here: it never reaches a log, a repository or a
# chat message. A verification endpoint that outlives its verification is a
# credential nobody is tracking.
#
# Cost: one 512 MB droplet for the minutes the run takes. Billing is hourly, so
# a full run costs less than a cent. The Terraform budget guard still counts it
# at the full monthly rate, because a guard with exceptions is not a guard.
#
# Destruction runs even when verification fails. A failed test that leaves a
# droplet behind turns a cent into a recurring charge nobody remembers.

on:
  workflow_dispatch:
    inputs:
      keep_node:
        description: Keep the node after verification. Leaves a running charge until destroyed.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  XRAY_VERSION: v25.8.3
  TF_IN_AUTOMATION: "1"

jobs:
  test-node:
    name: Test Node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Xray client
        run: |
          set -euo pipefail
          base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          curl -fsSL -o /tmp/xray.zip "${base}/Xray-linux-64.zip"
          curl -fsSL -o /tmp/xray.zip.dgst "${base}/Xray-linux-64.zip.dgst"

          expected=$(grep -i 'SHA2-256=' /tmp/xray.zip.dgst | head -1 | cut -d'=' -f2 | tr -d '[:space:]')
          actual=$(sha256sum /tmp/xray.zip | cut -d' ' -f1)
          echo "release digest: ${expected}"
          echo "downloaded    : ${actual}"
          if [ -n "${expected}" ] && [ "${expected}" != "${actual}" ]; then
            echo "Checksum mismatch."
            exit 1
          fi

          sudo unzip -o -q /tmp/xray.zip -d /usr/local/bin xray
          sudo chmod 0755 /usr/local/bin/xray
          xray version | head -2

      - name: Generate ephemeral credentials
        id: creds
        run: |
          set -euo pipefail
          uuid=$(xray uuid)
          keys=$(xray x25519)
          short=$(openssl rand -hex 8)

          # Xray renamed the public key to "Password" in the v25 line, so that
          # people would stop sharing it casually. Matching only on "public"
          # silently yields an empty key, the client then presents nothing, and
          # the handshake fails with no error anywhere. Both spellings are
          # accepted here.
          private=$(printf '%s\n' "${keys}" | grep -iE '^(PrivateKey|Private key)[[:space:]]*:' | awk '{print $NF}')
          public=$(printf '%s\n' "${keys}" | grep -iE '^(Password|Public key)[[:space:]]*:' | awk '{print $NF}')

          # Labels only. Printing which fields the tool emitted costs nothing
          # and turns a future rename into an obvious diff instead of a silent
          # empty value.
          echo "Fields returned by xray x25519:"
          printf '%s\n' "${keys}" | sed -E 's/:.*/: <redacted>/' | sed 's/^/  /'

          # The check that was missing the first time. An empty key produced a
          # node that looked healthy and carried no traffic, which is far more
          # expensive to diagnose than a failed step here.
          for pair in "uuid:${uuid}" "private:${private}" "public:${public}" "short:${short}"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ -z "${value}" ]; then
              echo "Credential '${name}' came out empty. Refusing to create a node nobody can reach."
              exit 1
            fi
          done

          # base64url of 32 bytes is 43 characters. A shorter value means the
          # parse grabbed the wrong field.
          for pair in "private:${private}" "public:${public}"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ "${#value}" -lt 40 ]; then
              echo "Credential '${name}' is ${#value} characters, expected about 43."
              exit 1
            fi
          done

          # Masked only after validation: masking first would hide the very
          # emptiness the checks above look for.
          echo "::add-mask::${uuid}"
          echo "::add-mask::${private}"
          echo "::add-mask::${public}"
          echo "::add-mask::${short}"

          {
            echo "uuid=${uuid}"
            echo "private=${private}"
            echo "public=${public}"
            echo "short=${short}"
          } >> "${GITHUB_OUTPUT}"

          echo "Credentials generated, validated and masked."

      - name: Terraform init
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: Create node
        id: create
        working-directory: infra/terraform
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          TF_VAR_test_node_enabled: "true"
          TF_VAR_test_node_uuid: ${{ steps.creds.outputs.uuid }}
          TF_VAR_test_node_reality_private_key: ${{ steps.creds.outputs.private }}
          TF_VAR_test_node_reality_short_id: ${{ steps.creds.outputs.short }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve
          ip=$(terraform output -raw test_node_ip)
          if [ -z "${ip}" ]; then
            echo "No address returned."
            exit 1
          fi
          echo "node_ip=${ip}" >> "${GITHUB_OUTPUT}"
          echo "Node created at ${ip}"

      - name: Wait for the node to answer
        id: wait
        env:
          NODE_IP: ${{ steps.create.outputs.node_ip }}
        run: |
          set -uo pipefail
          # cloud-init installs packages and Xray, which takes a while on a
          # fresh droplet. Polling beats a fixed sleep: a sleep is either too
          # short and flaky, or too long and wasteful.
          ready=false
          for attempt in $(seq 1 40); do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${NODE_IP}/443" 2>/dev/null; then
              echo "Port 443 accepting connections after ${attempt} attempts."
              ready=true
              break
            fi
            sleep 15
          done

          if [ "${ready}" != "true" ]; then
            echo "Node never opened port 443."
            exit 1
          fi

          # REALITY proxies to a real site when authentication fails, so an
          # ordinary TLS client must see that site's certificate. If it does
          # not, the camouflage is broken and the node is distinguishable.
          echo "Checking the fallback identity a scanner would see:"
          echo | timeout 10 openssl s_client -connect "${NODE_IP}:443" -servername www.microsoft.com 2>/dev/null \
            | openssl x509 -noout -issuer -subject 2>/dev/null || echo "  could not read certificate"

      - name: Verify traffic flows through the node
        id: verify
        env:
          NODE_IP: ${{ steps.create.outputs.node_ip }}
          UUID: ${{ steps.creds.outputs.uuid }}
          PUBLIC: ${{ steps.creds.outputs.public }}
          SHORT: ${{ steps.creds.outputs.short }}
        run: |
          set -euo pipefail

          jq -n \
            --arg ip "${NODE_IP}" \
            --arg uuid "${UUID}" \
            --arg pbk "${PUBLIC}" \
            --arg sid "${SHORT}" \
            '{
              log: { loglevel: "info" },
              inbounds: [
                { tag: "socks-in", protocol: "socks", listen: "127.0.0.1", port: 10808,
                  settings: { auth: "noauth", udp: true } }
              ],
              outbounds: [
                { tag: "proxy", protocol: "vless",
                  settings: { vnext: [ { address: $ip, port: 443,
                    users: [ { id: $uuid, encryption: "none", flow: "xtls-rprx-vision" } ] } ] },
                  streamSettings: { network: "tcp", security: "reality",
                    realitySettings: { serverName: "www.microsoft.com", publicKey: $pbk,
                      shortId: $sid, fingerprint: "chrome" } } }
              ]
            }' > /tmp/client.json

          xray run -config /tmp/client.json > /tmp/xray-client.log 2>&1 &
          client_pid=$!
          sleep 5

          if ! kill -0 "${client_pid}" 2>/dev/null; then
            echo "Client exited immediately:"
            cat /tmp/xray-client.log
            exit 1
          fi

          direct_ip=$(curl -fsS --max-time 15 https://api.ipify.org || echo "unknown")
          echo "Runner address:  ${direct_ip}"

          tunnel_ip=$(curl -fsS --max-time 25 --socks5-hostname 127.0.0.1:10808 https://api.ipify.org || echo "")
          echo "Address through the tunnel: ${tunnel_ip:-none}"

          kill "${client_pid}" 2>/dev/null || true

          if [ -z "${tunnel_ip}" ]; then
            echo "No traffic passed through the node."
            echo "Client log (info level, so a rejected handshake is visible):"
            sed 's/^/  /' /tmp/xray-client.log | tail -40
            exit 1
          fi

          if [ "${tunnel_ip}" != "${NODE_IP}" ]; then
            echo "Traffic exited from ${tunnel_ip}, expected ${NODE_IP}."
            exit 1
          fi

          echo "Verified: traffic exits from the node."
          {
            echo "## Test Node"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Node created | yes |"
            echo "| Port 443 reachable | yes |"
            echo "| VLESS + REALITY handshake | succeeded |"
            echo "| Exit address matches node | yes |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Destroy node
        if: ${{ always() && !inputs.keep_node }}
        working-directory: infra/terraform
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          TF_VAR_test_node_enabled: "false"
          TF_VAR_test_node_uuid: ${{ steps.creds.outputs.uuid }}
          TF_VAR_test_node_reality_private_key: ${{ steps.creds.outputs.private }}
          TF_VAR_test_node_reality_short_id: ${{ steps.creds.outputs.short }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve
          echo "Node destroyed."
          echo "| Node destroyed | yes |" >> "${GITHUB_STEP_SUMMARY}"

      - name: Confirm nothing is left running
        if: ${{ always() && !inputs.keep_node }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          # Terraform reporting success is not the same as the provider having
          # no droplets. This asks the provider directly.
          token=$(printf '%s' "${DIGITALOCEAN_TOKEN}" | tr -d '[:space:]')
          count=$(curl -sS -H "Authorization: Bearer ${token}" \
            "https://api.digitalocean.com/v2/droplets?per_page=100" | jq -r '(.droplets // []) | length')
          echo "Droplets remaining in the account: ${count}"
          echo "| Droplets remaining | ${count} |" >> "${GITHUB_STEP_SUMMARY}"

          if [ "${count}" != "0" ]; then
            echo "Something is still running. Check the account before the next run."
            exit 1
          fi

      - name: Warn when the node was kept
        if: ${{ always() && inputs.keep_node }}
        run: |
          {
            echo ""
            echo "**The node was kept and is being charged.** Destroy it by running this workflow"
            echo "again with keep_node disabled, or with terraform apply and test_node_enabled=false."
          } >> "${GITHUB_STEP_SUMMARY}"
