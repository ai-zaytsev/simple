name: Add Server

# From nothing to a node carrying people, in one operation.
#
# Until this existed a node was built by following node/README.md by hand,
# which took an afternoon and produced a machine slightly unlike the last one.
# The differences were always found later, on the node that had them.
#
# The steps are the ones the Business Owner named, and each of them moves the
# node through a state from stage 16, so that a build in progress is visible on
# the panel rather than only in this log:
#
#   creating -> configuring -> awaiting-certificate -> verifying -> ready
#
# Nothing here decides to spend money. Creating the machine is the one
# irreversible, billable step and it happens because a person pressed the
# button; the run says what it made and how to remove it.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: The consumable domain this node will answer on. Must not already be in use.
        required: true
        type: choice
        options:
          - 6047864.xyz
          - 6047865.xyz
          - 6015874.xyz
          - 6015875.xyz
      certificates:
        description: Test certificates cost nothing from the real weekly allowance. Real ones are trusted by phones.
        required: true
        default: test
        type: choice
        options:
          - test
          - real
      site:
        description: Which cover site to serve. Two nodes with the same page are two nodes that look related.
        required: true
        default: sourdough
        type: choice
        options:
          - pigeons
          - trams
          - sourdough
      datacenter:
        description: Kamatera datacenter id.
        required: true
        default: EU
        type: string
      capacity:
        description: How many tunnel connections this machine is sized for.
        required: true
        default: "500"
        type: string

permissions:
  contents: read

jobs:
  add:
    name: Add Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reach the Control Plane
        env:
          DEPLOY_KEY: ${{ secrets.CP_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.CP_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Name it, and write it down before it exists
        id: claim
        env:
          HOST: ${{ secrets.CP_DEPLOY_HOST }}
          DOMAIN: ${{ inputs.domain }}
          CERTIFICATES: ${{ inputs.certificates }}
          CAPACITY: ${{ inputs.capacity }}
        run: |
          set -euo pipefail

          if ! printf '%s' "${CAPACITY}" | grep -qE '^[0-9]{1,6}$'; then
            echo "Capacity must be a number of connections."
            exit 1
          fi

          # Refused rather than reused. A domain already carrying a node would
          # have its DNS pointed at the new machine halfway through this run,
          # and the people on the old one would stop being able to connect
          # while everything here reported success.
          inuse=$(bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
            "psql \"\$(cat /etc/simple-vpn-cp.dsn)\" -tAc \"select count(*) from nodes where params->>'server_name' = '${DOMAIN}' and state <> 'removed'\"")
          if [ "${inuse}" != "0" ]; then
            echo "${DOMAIN} is already serving a node. Pick a free one, or retire that node first."
            exit 1
          fi

          # And refused again if it is a way in to the Control Plane.
          #
          # A domain with no node behind it looks free to the check above and is
          # not: some of them are the addresses devices try when they need to be
          # told where to go next. Pointing one at a new machine halfway through
          # this run would break the path every recovery depends on, and it
          # would break it quietly - the node would work, and the way back to
          # us would be gone.
          #
          # This is the same domain the lifecycle stage found could have no
          # condition of its own, for the same reason: nothing was looking at
          # domains that carry no node.
          entry=$(bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
            "psql \"\$(cat /etc/simple-vpn-cp.dsn)\" -tAc \"select count(*) from bootstrap_entries where lower(host) = lower('${DOMAIN}') and enabled\"")
          if [ "${entry}" != "0" ]; then
            echo "${DOMAIN} is a way in to the Control Plane, not a spare cover."
            echo "Pointing it at a node would take that way in away."
            exit 1
          fi

          alias="n-$(openssl rand -hex 2)"
          token=$(openssl rand -base64 32 | tr -d '\n')
          token_hash=$(printf '%s' "${token}" | sha256sum | cut -d' ' -f1)
          ws_path="/$(openssl rand -hex 12)"
          edge_path="/$(openssl rand -hex 12)"

          # The secret never reaches the log or the summary. Its hash goes to
          # the database and the value itself is carried to the machine over
          # ssh, in one step, later in this run.
          echo "::add-mask::${token}"

          {
            echo "alias=${alias}"
            echo "token=${token}"
            echo "ws_path=${ws_path}"
            echo "edge_path=${edge_path}"
          } >> "${GITHUB_OUTPUT}"

          # Recorded before the machine exists, so that there is never a
          # running node nobody can account for.
          params=$(jq -n \
            --arg sn "${DOMAIN}" --arg hh "${DOMAIN}" --arg p "${ws_path}" \
            --arg certs "${CERTIFICATES}" --argjson cap "${CAPACITY}" \
            '{server_name: $sn, host_header: $hh, path: $p, fingerprint: "chrome",
              certificates: $certs, capacity: $cap}')

          cat > /tmp/statement.sql <<SQL
          insert into nodes (id, alias, host, port, transport_kind, params, state, token_hash)
          values (gen_random_uuid(), '${alias}', '0.0.0.0', 443, 'vless-ws-tls',
                  '${params}'::jsonb, 'creating', decode('${token_hash}', 'hex'));
          insert into domains (name, purpose, lifecycle)
          values (lower('${DOMAIN}'), 'node', 'ready')
          on conflict (name) do update set lifecycle = 'ready', since = now();
          SQL
          SSH_STDIN=/tmp/statement.sql bash infra/ssh-retry.sh \
            -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
            'psql "$(cat /etc/simple-vpn-cp.dsn)" -v ON_ERROR_STOP=1 -P pager=off -f -'

          echo "Recorded ${alias} for ${DOMAIN}, state creating."

      - name: Create the machine
        id: machine
        env:
          KAMATERA_KEY: ${{ secrets.KAMATERA_ACCESS_KEY }}
          KAMATERA_SECRET: ${{ secrets.KAMATERA_SECRET_KEY }}
          KAMATERA_ACCESS_KEY: ${{ secrets.KAMATERA_ACCESS_KEY }}
          KAMATERA_SECRET_KEY: ${{ secrets.KAMATERA_SECRET_KEY }}
          DATACENTER: ${{ inputs.datacenter }}
          ALIAS: ${{ steps.claim.outputs.alias }}
        run: |
          set -euo pipefail
          . infra/kamatera.sh
          # The provider's own address, taken from the workflow that has been
          # talking to it successfully all along rather than from what looked
          # plausible. Three separate facts about this interface were invented
          # across three attempts - the image name, the shape of its answer,
          # and this host - and each cost a run. What follows mirrors the
          # working operation step for step.
          api="https://cloudcli.cloudwm.com"

          # Trimmed, because a credential that arrives with a trailing newline
          # is refused in a way that reads like a wrong credential.
          client=$(printf '%s' "${KAMATERA_KEY}" | tr -d '[:space:]')
          secret=$(printf '%s' "${KAMATERA_SECRET}" | tr -d '[:space:]')
          auth=(-H "AuthClientId: ${client}" -H "AuthSecret: ${secret}" -H "Accept: application/json")

          # Asked rather than assumed. Image identifiers belong to a datacenter
          # and change, so looking one up means changing datacenter works and a
          # changed identifier is noticed here rather than six months from now.
          image=$(curl -sS "${auth[@]}" \
            "${api}/service/server?images=1&datacenter=${DATACENTER}" \
            | jq -r '[.. | objects | select((.os? // "") == "Ubuntu" and ((.code? // "") | startswith("24.04")))] | .[0].id // empty')

          if [ -z "${image}" ]; then
            echo "No Ubuntu 24.04 image is offered in ${DATACENTER}."
            echo "Run the Kamatera Node workflow with action=options to see what is."
            exit 1
          fi
          echo "Using image ${image}"

          pubkey=$(ssh-keygen -y -f ~/.ssh/deploy)

          body=$(jq -n --arg name "simple-vpn-${ALIAS}" --arg dc "${DATACENTER}" \
            --arg key "${pubkey}" --arg image "${image}" \
            '{name: $name, password: "__generate__", passwordValidate: "__generate__",
              "ssh-key": $key, datacenter: $dc, image: $image,
              cpu: "1B", ram: 1024, disk: "size=20", dailybackup: "no", managed: "no",
              network: "name=wan,ip=auto", quantity: 1, billingcycle: "hourly",
              monthlypackage: "", poweronaftercreate: "yes"}')

          created=$(curl -sS -X POST "${auth[@]}" -H "content-type: application/json" \
            -d "${body}" "${api}/service/server" || echo '{}')

          # The provider returns a generated root password. It is not ours to
          # publish and we do not use it - access is by key - so it never
          # leaves this step.
          password=$(printf '%s' "${created}" | jq -r '.password // empty' 2>/dev/null || echo "")
          [ -n "${password}" ] && echo "::add-mask::${password}"

          command_id=$(printf '%s' "${created}" \
            | jq -r '(.commandIds[0]? // .commandId? // (if type == "array" then .[0] else empty end)) // empty' \
            2>/dev/null || echo "")
          if [ -z "${command_id}" ] || [ "${command_id}" = "null" ]; then
            echo "The provider did not start the creation. It said:"

            # Every string it sent back, wherever in the answer it put it,
            # except anything whose name suggests a secret.
            #
            # Two earlier versions of this printed nothing useful: first only
            # the field names, which said "errors", and then only a guessed
            # path inside them. The reason that time - the account's active
            # server quota was full - arrived by email, from the provider, to
            # a person. A run that fails has to say why without anybody
            # opening their inbox.
            printf '%s' "${created}" | jq -r '
              [paths(strings) as $p | {k: ($p | map(tostring) | join(".")), v: getpath($p)}]
              | map(select((.k | test("password|secret|key|token"; "i")) | not))
              | map(select((.v | length) > 0))
              | .[:12][] | "  \(.k): \(.v)"' 2>/dev/null \
              || printf '%s' "${created}" | jq -r '"  fields: " + (keys_unsorted | join(", "))' 2>/dev/null \
              || echo "  the answer could not be read"
            exit 1
          fi

          echo "The provider accepted the creation (command ${command_id})."

          # Waiting for an address rather than following the command queue.
          #
          # The queue was followed here until it answered {error, message} on
          # every poll for five minutes while the machine was being built
          # perfectly well - it appeared at the provider, running, with an
          # address. Two things were wrong: the queue endpoint was a guess, and
          # what was being waited for was not what was needed.
          #
          # A build needs an address. Asking for that directly removes the guess
          # and shortens the chain: the machine is ready when it can be reached,
          # not when a queue says a word.
          address=$(kamatera_wait_for_address "simple-vpn-${ALIAS}" 40 /tmp/one.json) || true

          if [ -z "${address}" ]; then
            echo "The machine did not report an address."
            echo "Look for simple-vpn-${ALIAS} at the provider and remove it if it is there."
            exit 1
          fi

          # Registered for masking before it is written anywhere.
          #
          # A step output is not a secret, and every later step that takes it
          # through `env:` prints it in that step's environment block. So the
          # address would have appeared a dozen times in a public log without
          # anybody echoing it once. Masking it here covers every one of those,
          # because it applies to everything this job prints afterwards.
          #
          # The address of a node is the single fact somebody intending to
          # block this service would most like to be handed. The cover domain
          # in front of the machine exists so that the address is not the
          # obvious thing about it.
          echo "::add-mask::${address}"

          echo "address=${address}" >> "${GITHUB_OUTPUT}"
          echo "simple-vpn-${ALIAS} has an address."

      - name: Point the domain at it
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SS_KEY: ${{ secrets.SPACESHIP_API_KEY }}
          SS_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
          DOMAIN: ${{ inputs.domain }}
          ADDRESS: ${{ steps.machine.outputs.address }}
        run: bash infra/point-dns.sh

      - name: Configuring
        env:
          HOST: ${{ secrets.CP_DEPLOY_HOST }}
          ALIAS: ${{ steps.claim.outputs.alias }}
          ADDRESS: ${{ steps.machine.outputs.address }}
        run: |
          set -euo pipefail
          cat > /tmp/statement.sql <<SQL
          update nodes set host = '${ADDRESS}', state = 'configuring', state_since = now()
          where alias = '${ALIAS}';
          SQL
          SSH_STDIN=/tmp/statement.sql bash infra/ssh-retry.sh \
            -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
            'psql "$(cat /etc/simple-vpn-cp.dsn)" -v ON_ERROR_STOP=1 -P pager=off -f -'
          # The alias, never the address. The repository is public, so this log
          # is public, and a node address in it is the one fact somebody
          # intending to block this service would most like to be given. The
          # cover domain in front of the machine exists precisely so that the
          # address is not the obvious thing about it.
          echo "${ALIAS} has an address recorded and is being configured."

          # The endpoints only nodes use are closed to everybody else, and this
          # machine has just become one of the nodes. Without this it would
          # come up unable to learn who may connect, ask for a certificate or
          # report anything - three failures at three later steps, all of them
          # looking like something else.
          # Carried from the checkout rather than run from a copy installed on
          # the host, so there is no second copy to drift from this one.
          SSH_PROGRAM=scp bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes \
            control-plane/deploy/nginx-node-only.py "root@${HOST}:/tmp/"
          bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
            'python3 /tmp/nginx-node-only.py; rm -f /tmp/nginx-node-only.py'

      - name: Wait for the machine to answer
        env:
          ADDRESS: ${{ steps.machine.outputs.address }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "${ADDRESS}" >> ~/.ssh/known_hosts 2>/dev/null || true
          for _ in $(seq 1 40); do
            if ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=8 \
                 -o StrictHostKeyChecking=accept-new "root@${ADDRESS}" true 2>/dev/null; then
              echo "It answers."
              exit 0
            fi
            sleep 10
          done
          echo "The machine never accepted a connection."
          exit 1

      - name: An ordinary site, then the VPN
        env:
          ADDRESS: ${{ steps.machine.outputs.address }}
          DOMAIN: ${{ inputs.domain }}
          SITE: ${{ inputs.site }}
          NODE_TOKEN: ${{ steps.claim.outputs.token }}
          WS_PATH: ${{ steps.claim.outputs.ws_path }}
          EDGE_PATH: ${{ steps.claim.outputs.edge_path }}
        run: |
          set -euo pipefail
          SSH_PROGRAM=scp bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes -r "sites/${SITE}" "root@${ADDRESS}:/tmp/site"
          SSH_PROGRAM=scp bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes \
            node/provision.sh node/harden-ssh.sh \
            node/users-agent.py node/install-users-agent.sh \
            "root@${ADDRESS}:/tmp/"

          # The secret travels here and nowhere else, over ssh, in an
          # environment rather than an argument: an argument list is visible to
          # every process on the machine.
          bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${ADDRESS}" \
            "NODE_DOMAIN='${DOMAIN}' CP_URL='https://simple-syncbridge.download' \
             NODE_TOKEN='${NODE_TOKEN}' WS_PATH='${WS_PATH}' EDGE_PATH='${EDGE_PATH}' \
             bash /tmp/provision.sh"

      - name: A certificate
        env:
          HOST: ${{ secrets.CP_DEPLOY_HOST }}
          ADDRESS: ${{ steps.machine.outputs.address }}
          ALIAS: ${{ steps.claim.outputs.alias }}
        run: |
          set -euo pipefail
          cat > /tmp/statement.sql <<SQL
          update nodes set state = 'awaiting-certificate', state_since = now() where alias = '${ALIAS}';
          SQL
          SSH_STDIN=/tmp/statement.sql bash infra/ssh-retry.sh \
            -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
            'psql "$(cat /etc/simple-vpn-cp.dsn)" -v ON_ERROR_STOP=1 -P pager=off -f -'

          SSH_PROGRAM=scp bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes \
            node/certificate-agent.sh node/install-certificate-agent.sh "root@${ADDRESS}:/tmp/"
          bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${ADDRESS}" 'bash /tmp/install-certificate-agent.sh'

      - name: Measurement
        env:
          ADDRESS: ${{ steps.machine.outputs.address }}
        run: |
          set -euo pipefail
          SSH_PROGRAM=scp bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes \
            node/metrics-agent.py node/xray-observability.py \
            node/check-privacy.sh node/speed-limit.sh \
            node/install-metrics-agent.sh "root@${ADDRESS}:/tmp/"
          bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${ADDRESS}" 'bash /tmp/install-metrics-agent.sh'

      - name: Check it from outside
        env:
          HOST: ${{ secrets.CP_DEPLOY_HOST }}
          ADDRESS: ${{ steps.machine.outputs.address }}
          DOMAIN: ${{ inputs.domain }}
          ALIAS: ${{ steps.claim.outputs.alias }}
          WS_PATH: ${{ steps.claim.outputs.ws_path }}
          CERTIFICATES: ${{ inputs.certificates }}
        run: |
          set -euo pipefail
          cat > /tmp/statement.sql <<SQL
          update nodes set state = 'verifying', state_since = now() where alias = '${ALIAS}';
          SQL
          SSH_STDIN=/tmp/statement.sql bash infra/ssh-retry.sh \
            -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
            'psql "$(cat /etc/simple-vpn-cp.dsn)" -v ON_ERROR_STOP=1 -P pager=off -f -'

          fail=0
          note() { echo "  $*"; }

          # The cover site, as a stranger sees it.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            --resolve "${DOMAIN}:443:${ADDRESS}" ${CERTIFICATES:+$([ "${CERTIFICATES}" = "test" ] && echo --insecure)} \
            "https://${DOMAIN}/" || echo 000)
          [ "${code}" = "200" ] && note "site answers 200" || { note "site answered ${code}"; fail=1; }

          # The certificate, and that it came from the authority it should have.
          issuer=$(echo | openssl s_client -connect "${ADDRESS}:443" -servername "${DOMAIN}" 2>/dev/null \
            | openssl x509 -noout -issuer 2>/dev/null || echo "")
          note "certificate issuer: ${issuer:-none}"
          if [ "${CERTIFICATES}" = "test" ]; then
            printf '%s' "${issuer}" | grep -qi "staging" \
              && note "issued by the test authority, as asked" \
              || { note "a test node was given something other than a test certificate"; fail=1; }
          else
            printf '%s' "${issuer}" | grep -qi "let's encrypt" \
              && note "issued by the real authority, as asked" \
              || { note "a real node was not given a real certificate"; fail=1; }
          fi

          # A wrong request to the tunnel path must look like the rest of the site.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            --resolve "${DOMAIN}:443:${ADDRESS}" $([ "${CERTIFICATES}" = "test" ] && echo --insecure) \
            "https://${DOMAIN}${WS_PATH}" || echo 000)
          [ "${code}" = "404" ] && note "a plain request to the tunnel path gets 404" \
            || { note "the tunnel path answered ${code} to a plain request"; fail=1; }

          # And a real upgrade must reach the engine.
          code=$(curl -sS --http1.1 -o /dev/null -w '%{http_code}' --max-time 10 \
            --resolve "${DOMAIN}:443:${ADDRESS}" $([ "${CERTIFICATES}" = "test" ] && echo --insecure) \
            -H "Upgrade: websocket" -H "Connection: Upgrade" \
            -H "Sec-WebSocket-Key: AQIDBAUGBwgJCgsMDQ4PEA==" -H "Sec-WebSocket-Version: 13" \
            "https://${DOMAIN}${WS_PATH}" 2>/dev/null || true)

          # `|| true` rather than `|| echo 000`, and this is the whole of what
          # went wrong the first time this step ran on a real node.
          #
          # After a successful upgrade curl has nowhere to go: the connection
          # stays open until --max-time and curl exits non-zero having already
          # printed the code. The fallback then appended to it, and a healthy
          # tunnel was reported as answering "101000".
          code="${code:-000}"
          [ "${code}" = "101" ] && note "the tunnel upgrades" || { note "the tunnel answered ${code}"; fail=1; }

          # It keeps no record of where anybody went.
          bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${ADDRESS}" \
            '/usr/local/bin/simple-vpn-check-privacy' | sed 's/^/  /' || fail=1

          # And the Control Plane has heard from it.
          echo "  waiting for the first report"
          seen=0
          for _ in $(seq 1 12); do
            sleep 15
            n=$(bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
              "psql \"\$(cat /etc/simple-vpn-cp.dsn)\" -tAc \"select count(*) from metrics.node_samples where node_alias = '${ALIAS}'\"")
            if [ "${n}" != "0" ]; then seen=1; break; fi
          done
          [ "${seen}" = "1" ] && note "it is reporting" || { note "no report arrived in three minutes"; fail=1; }

          exit "${fail}"

      - name: Close it to everything but the way in
        env:
          ADDRESS: ${{ steps.machine.outputs.address }}
          CP_ADDRESS: ${{ secrets.CP_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          # Last, because every step before it needed to reach this machine
          # directly. Afterwards management arrives through the Control Plane
          # and a scan of this node from the internet finds a web server and
          # nothing else, which is what the stage asks for.
          SSH_PROGRAM=scp bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes \
            node/firewall.sh "root@${ADDRESS}:/tmp/"

          # No revert armed: nothing after this needs the connection, and a
          # firewall that undoes itself three minutes after a run finishes
          # would leave the node open with nobody watching.
          bash infra/ssh-retry.sh -i ~/.ssh/deploy -o BatchMode=yes "root@${ADDRESS}" \
            "ALLOW_SSH_FROM='${CP_ADDRESS}' REVERT_AFTER=0 bash /tmp/firewall.sh; rm -f /tmp/firewall.sh"

      - name: Ready
        env:
          HOST: ${{ secrets.CP_DEPLOY_HOST }}
          ALIAS: ${{ steps.claim.outputs.alias }}
          DOMAIN: ${{ inputs.domain }}
          EDGE_PATH: ${{ steps.claim.outputs.edge_path }}
        run: |
          set -euo pipefail
          # `ready` rather than `serving`: both are handed out, and the
          # difference records that nobody has yet chosen to lean on it.
          cat > /tmp/statement.sql <<SQL
          update nodes set state = 'ready', state_since = now(),
                 state_note = 'built by the Add Server workflow'
          where alias = '${ALIAS}';
          update domains set lifecycle = 'serving', since = now() where name = lower('${DOMAIN}');
          insert into bootstrap_entries (id, kind, host, port, path_prefix, weight, note)
          values (gen_random_uuid(), 'https-edge', '${DOMAIN}', 443, '${EDGE_PATH}', 60,
                  'Node ${ALIAS} forwards the API');
          SQL
          SSH_STDIN=/tmp/statement.sql bash infra/ssh-retry.sh \
            -i ~/.ssh/deploy -o BatchMode=yes "root@${HOST}" \
            'psql "$(cat /etc/simple-vpn-cp.dsn)" -v ON_ERROR_STOP=1 -P pager=off -f -'
          echo "${ALIAS} is ready and will be handed out."

      - name: Say what was made
        if: always()
        env:
          ALIAS: ${{ steps.claim.outputs.alias }}
          DOMAIN: ${{ inputs.domain }}
          ADDRESS: ${{ steps.machine.outputs.address }}
          CERTIFICATES: ${{ inputs.certificates }}
        run: |
          {
            echo "### Add Server"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| node | \`${ALIAS}\` |"
            echo "| domain | \`${DOMAIN}\` |"
            echo "| address | $([ -n "${ADDRESS:-}" ] && echo recorded || echo "not created") |"
            echo "| certificates | ${CERTIFICATES} |"
            echo "| machine | \`simple-vpn-${ALIAS}\` at Kamatera, billed hourly |"
            echo
            echo "If this run did not reach the end, the machine may still exist."
            echo "Remove it with the Kamatera Node workflow, action \`destroy\`,"
            echo "server name \`simple-vpn-${ALIAS}\`."
          } >> "${GITHUB_STEP_SUMMARY}"
