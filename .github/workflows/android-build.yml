name: Android Build

# Builds the APK and records what it is made of.
#
# No local machine builds this: there is no JDK, SDK or Go on the developer
# host, so CI is the only build environment. That is an advantage rather than a
# gap, because the toolchain is pinned in one place and every artifact is
# traceable to a commit.
#
# Reproducibility here means: pinned Gradle, pinned AGP and Kotlin through the
# version catalog, no dependency ranges, no wrapper binary in the repository,
# a pinned routing database and a recorded SHA-256 for the artifact. It does
# not yet mean bit-identical release APKs, which additionally requires a fixed
# signing setup.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'vpncore/**'
      - '.github/workflows/android-build.yml'

env:
  # Routing sends Russian and private addresses straight out, and both rules
  # are expressed as geoip entries the engine reads from this database. Pinned
  # to a release rather than tracking latest, so that two builds of the same
  # commit route identically.
  GEOIP_TAG: '202608050239'

permissions:
  contents: read

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Report toolchain
        working-directory: android
        run: |
          set -euo pipefail
          echo "Gradle: $(gradle --version | grep -E '^Gradle' | head -1)"
          echo "Java:   $(java -version 2>&1 | head -1)"
          {
            echo "## Android Build"
            echo ""
            echo "| Component | Version |"
            echo "| --- | --- |"
            echo "| Gradle | 8.11.1 |"
            echo "| JDK | temurin 17 |"
            echo "| Routing database | ${GEOIP_TAG} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore the routing database
        id: geoip
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/geoip.dat
          key: geoip-${{ env.GEOIP_TAG }}

      - name: Download the routing database
        if: steps.geoip.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/v2fly/geoip/releases/download/${GEOIP_TAG}"
          mkdir -p android/app/src/main/assets
          curl -fsSL -o /tmp/geoip.dat "${base}/geoip.dat"
          curl -fsSL -o /tmp/geoip.dat.sha256sum "${base}/geoip.dat.sha256sum"

          # The published sum is compared field by field rather than by
          # searching the file, because a substring match once accepted the
          # wrong line and put two hashes into one variable.
          expected=$(awk '{print $1}' /tmp/geoip.dat.sha256sum | head -1)
          actual=$(sha256sum /tmp/geoip.dat | awk '{print $1}')
          if [ "${expected}" != "${actual}" ]; then
            echo "Routing database checksum mismatch."
            echo "  expected: ${expected}"
            echo "  actual:   ${actual}"
            exit 1
          fi

          mv /tmp/geoip.dat android/app/src/main/assets/geoip.dat
          echo "Routing database verified: ${actual}"

      - name: Restore the native library
        id: native
        uses: actions/cache@v4
        with:
          path: android/app/libs/vpncore.aar
          key: vpncore-${{ hashFiles('vpncore/**') }}

      - name: Setup Go
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build the native library
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # One library, not two. The engine and the packet bridge are bound
          # together because each gomobile binding carries its own copy of the
          # Go runtime, and two copies in one APK fail the build on duplicated
          # runtime classes. Both dependencies are pinned in vpncore/go.mod,
          # which is the same source-pinning rule the engine already followed
          # (ADR-020).
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:${PATH}"
          gomobile init

          mkdir -p "${GITHUB_WORKSPACE}/android/app/libs"
          cd vpncore
          go mod tidy

          # -checklinkname=0 is required, not a convenience. The bridge reads
          # network interfaces through a library that reaches into private
          # runtime symbols with go:linkname, because Android blocks the normal
          # way of listing interfaces. Go 1.23 started rejecting those
          # references at link time:
          #   link: github.com/wlynxg/anet: invalid reference to net.zoneCache
          gomobile bind -target=android/arm64 -androidapi 24 \
            -ldflags="-checklinkname=0" \
            -o "${GITHUB_WORKSPACE}/android/app/libs/vpncore.aar" .
          sha256sum "${GITHUB_WORKSPACE}/android/app/libs/vpncore.aar"

      - name: Check format strings
        # Before assembling, and without Gradle: a placeholder the
        # formatter cannot read is not a compile error. It throws when
        # the text is drawn, on a phone, in front of somebody.
        run: bash android/tools/check-format-strings.sh

      - name: Test the rules
        working-directory: android
        # Failover and the kill switch are only exercised when
        # something is already broken. That is the worst moment to
        # find out they were written wrong, so the rules are plain
        # Kotlin and are checked here, on the build machine.
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Record artifact identity
        working-directory: android
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "${apk}" ]; then
            echo "No APK was produced."
            exit 1
          fi

          size=$(stat -c%s "${apk}")
          sha=$(sha256sum "${apk}" | cut -d' ' -f1)

          echo "APK:    ${apk}"
          echo "Size:   ${size} bytes"
          echo "SHA256: ${sha}"

          {
            echo "| APK size | ${size} bytes |"
            echo "| APK SHA-256 | \`${sha}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          # An APK that installs is not the same as an APK that can establish a
          # tunnel. Both parts are named separately so the report cannot claim
          # more than was actually bundled.
          if [ -f app/libs/vpncore.aar ]; then
            echo "| Engine and packet bridge | bundled |" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "| Engine and packet bridge | NOT bundled, no tunnel possible |" >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ -f app/src/main/assets/geoip.dat ]; then
            echo "| Routing database | bundled |" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "| Routing database | NOT bundled, engine will refuse to start |" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
